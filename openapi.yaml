openapi: 3.0.3
info:
  title: Shamba Direct API
  description: Farmer-to-buyer produce marketplace API.
  version: "1.0.0"
servers:
  - url: http://localhost:5000

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Product:
      type: object
      properties:
        id: { type: integer }
        farmer_id: { type: integer }
        name: { type: string }
        category: { type: string, nullable: true }
        price_per_kg: { type: string, description: "Decimal, serialized as a string" }
        quantity_kg: { type: string, description: "Decimal, serialized as a string" }
        county: { type: string, nullable: true }
        harvest_note: { type: string, nullable: true }
        image_emoji: { type: string }
        status: { type: string, enum: [pending_review, active, sold_out, removed] }
        views: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        farmer_name: { type: string }
        farmer_verified: { type: integer, description: "0 or 1" }
      required: [id, farmer_id, name, price_per_kg, quantity_kg]

    ProductInput:
      type: object
      properties:
        farmerId: { type: integer }
        name: { type: string }
        category: { type: string }
        pricePerKg: { type: number }
        quantityKg: { type: number }
        county: { type: string }
        harvestNote: { type: string }
        imageEmoji: { type: string }
        status: { type: string, enum: [pending_review, active, sold_out, removed] }
      required: [farmerId, name, pricePerKg, quantityKg]

    ProductPatchInput:
      description: >
        Used for PUT /api/products/{id}. Unlike ProductInput (used for POST),
        every field here is optional — an update only changes the fields you
        send; anything omitted is left as-is. This is a separate schema from
        ProductInput specifically so a consumer reading the contract doesn't
        assume PUT requires the same fields POST does.
      type: object
      properties:
        name: { type: string }
        category: { type: string }
        pricePerKg: { type: number }
        quantityKg: { type: number }
        county: { type: string }
        harvestNote: { type: string }
        status: { type: string, enum: [pending_review, active, sold_out, removed] }

    Order:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: integer }
        buyer_id: { type: integer }
        farmer_id: { type: integer }
        quantity_kg: { type: string }
        total_price: { type: string }
        status: { type: string, enum: [pending, confirmed, delivered, cancelled] }
        created_at: { type: string, format: date-time }
        product_name: { type: string }
        buyer_name: { type: string }
        buyer_phone: { type: string }
        buyer_county: { type: string }
        farmer_name: { type: string }
      required: [id, product_id, buyer_id, farmer_id, status]

    OrderInput:
      type: object
      properties:
        productId: { type: integer }
        buyerId: { type: integer }
        quantityKg: { type: number, exclusiveMinimum: 0, description: "Must be greater than 0" }
      required: [productId, buyerId, quantityKg]

    OrderStatusInput:
      type: object
      properties:
        status: { type: string, enum: [pending, confirmed, delivered, cancelled] }
      required: [status]

    Rating:
      type: object
      properties:
        id: { type: integer }
        farmer_id: { type: integer }
        buyer_id: { type: integer }
        order_id: { type: integer, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 5 }
        review_text: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, farmer_id, buyer_id, rating]

    RatingInput:
      type: object
      properties:
        farmerId: { type: integer }
        buyerId: { type: integer }
        orderId: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        reviewText: { type: string }
      required: [farmerId, buyerId, rating]

    Enquiry:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: integer }
        buyer_id: { type: integer, nullable: true }
        farmer_id: { type: integer }
        message: { type: string }
        created_at: { type: string, format: date-time }
        product_name: { type: string }
        buyer_name: { type: string, nullable: true }
      required: [id, product_id, farmer_id, message]

    EnquiryInput:
      type: object
      properties:
        productId: { type: integer }
        buyerId: { type: integer }
        message: { type: string }
      required: [productId, buyerId, message]

    ContactMessage:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        contact_info: { type: string }
        subject: { type: string, nullable: true }
        message: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, name, contact_info, message]

    ContactMessageInput:
      type: object
      properties:
        name: { type: string }
        contactInfo: { type: string }
        subject: { type: string }
        message: { type: string }
      required: [name, contactInfo, message]

    Headquarters:
      type: object
      properties:
        id: { type: integer }
        region_name: { type: string }
        county: { type: string }
        address: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
      required: [id, region_name, county]

    HeadquartersInput:
      type: object
      properties:
        regionName: { type: string }
        county: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
      required: [regionName, county]

    MarketPrice:
      type: object
      properties:
        id: { type: integer }
        crop_name: { type: string }
        price_per_kg: { type: string }
        county: { type: string, nullable: true }
      required: [id, crop_name, price_per_kg]

    MarketPriceInput:
      type: object
      properties:
        cropName: { type: string }
        pricePerKg: { type: number }
        county: { type: string }
      required: [cropName, pricePerKg]

    User:
      type: object
      properties:
        id: { type: integer }
        full_name: { type: string }
        email: { type: string, nullable: true }
        phone_number: { type: string }
        role: { type: string, enum: [farmer, buyer] }
        county: { type: string, nullable: true }
        is_verified: { type: integer }
      required: [id, full_name, phone_number, role]

    RegisterInput:
      type: object
      properties:
        role: { type: string, enum: [farmer, buyer] }
        fullName: { type: string }
        email: { type: string }
        phoneNumber: { type: string }
        password: { type: string }
        county: { type: string }
        farmSize: { type: string }
        nationalId: { type: string }
        mainCrops: { type: string }
        companyName: { type: string }
        kraPin: { type: string }
        businessType: { type: string }
        productsNeeded: { type: string }
        deliveryAddress: { type: string }
      required: [role, fullName, phoneNumber, password]

    LoginInput:
      type: object
      properties:
        phoneNumber: { type: string }
        password: { type: string }
      required: [phoneNumber, password]

paths:
  /api/products:
    get:
      summary: List products (filterable)
      parameters:
        - in: query
          name: county
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: farmerId
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: minQuantity
          schema: { type: number }
      responses:
        "200":
          description: Array of products (empty array if none match)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
    post:
      summary: Create a listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  id: { type: integer }
        "400":
          description: Missing required fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/products/{id}:
    get:
      summary: Get a single product (increments its view count as a side effect)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      summary: Update a listing (any subset of fields; unset fields are left unchanged)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductPatchInput' }
      responses:
        "200": { description: Updated }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Delete a listing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Deleted }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/orders:
    get:
      summary: List orders (filterable by farmerId, buyerId, status)
      parameters:
        - in: query
          name: farmerId
          schema: { type: integer }
        - in: query
          name: buyerId
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Array of orders (empty array if none match)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
    post:
      summary: Place an order against a listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  id: { type: integer }
                  totalPrice: { type: number }
        "400":
          description: Missing fields, or quantity exceeds availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Listing not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/orders/{id}:
    put:
      summary: Update an order's status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderStatusInput' }
      responses:
        "200": { description: Updated }
        "400":
          description: status not one of the allowed values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Delete an order
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Deleted }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/ratings:
    get:
      summary: List ratings. With farmerId, also returns an aggregate average and review count.
      parameters:
        - in: query
          name: farmerId
          schema: { type: integer }
        - in: query
          name: buyerId
          schema: { type: integer }
      responses:
        "200":
          description: >
            If farmerId is given, an object { ratings: Rating[], averageRating: number, reviewCount: integer }.
            Otherwise, a plain array of Rating.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      ratings:
                        type: array
                        items: { $ref: '#/components/schemas/Rating' }
                      averageRating: { type: number }
                      reviewCount: { type: integer }
                  - type: array
                    items: { $ref: '#/components/schemas/Rating' }
    post:
      summary: Submit a rating for a farmer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RatingInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  id: { type: integer }
        "400":
          description: Missing fields, or rating outside 1-5
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/ratings/{id}:
    delete:
      summary: Delete a rating
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Deleted }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/enquiries:
    get:
      summary: List enquiries (filterable by farmerId, productId)
      parameters:
        - in: query
          name: farmerId
          schema: { type: integer }
        - in: query
          name: productId
          schema: { type: integer }
      responses:
        "200":
          description: Array of enquiries (empty array if none match)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Enquiry' }
    post:
      summary: Send an enquiry to a farmer about a listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnquiryInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  id: { type: integer }
        "400":
          description: Missing fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Listing not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/enquiries/{id}:
    delete:
      summary: Delete an enquiry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Deleted }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/contact:
    get:
      summary: List contact messages (admin inbox)
      responses:
        "200":
          description: Array of contact messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContactMessage' }
    post:
      summary: Submit the About & Contact page form
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMessageInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  messageId: { type: integer }
        "400":
          description: Missing fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/contact/{id}:
    delete:
      summary: Delete a contact message
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Deleted }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/headquarters:
    get:
      summary: List regional headquarters
      responses:
        "200":
          description: Array of headquarters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Headquarters' }
    post:
      summary: Add a headquarters hub
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeadquartersInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  id: { type: integer }
        "400":
          description: Missing fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/headquarters/{id}:
    get:
      summary: Get a single headquarters hub
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The headquarters record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Headquarters' }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      summary: Update a headquarters hub
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeadquartersInput' }
      responses:
        "200": { description: Updated }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Delete a headquarters hub
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Deleted }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/market-prices:
    get:
      summary: List market prices (optionally filtered by county)
      parameters:
        - in: query
          name: county
          schema: { type: string }
      responses:
        "200":
          description: Array of market prices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MarketPrice' }
    post:
      summary: Add a market price point
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketPriceInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  id: { type: integer }
        "400":
          description: Missing fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/market-prices/{id}:
    put:
      summary: Update a market price's value
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pricePerKg: { type: number }
              required: [pricePerKg]
      responses:
        "200": { description: Updated }
        "400":
          description: pricePerKg is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Delete a market price entry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Deleted }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/register:
    post:
      summary: Register a new farmer or buyer account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  userId: { type: integer }
        "400":
          description: Missing required fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: Phone number or email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/login:
    post:
      summary: Log in with phone number and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        "400":
          description: Missing phoneNumber or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/users/{id}:
    put:
      summary: Update a user's profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                email: { type: string }
                county: { type: string }
                farmSize: { type: string }
                mainCrops: { type: string }
                businessType: { type: string }
                deliveryAddress: { type: string }
      responses:
        "200": { description: Updated }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Delete a user account
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Deleted }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
