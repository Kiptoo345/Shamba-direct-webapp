      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  user: {$ref: '#/components/schemas/User'}
              example:
                message: "Login successful"
                user:
                  id: 4
                  full_name: "Test Buyer"
                  email:
                  phone_number: "0700000001"
                  role: "buyer"
                  county: "Nairobi"
                  is_verified: 0
                  created_at: "2026-10-13T18:34:13.000Z"
                  updated_at: "2026-10-13T18:34:13.000Z"
                  profile:
                    company_name: "Test Foods Ltd"
                    business_type:
                    delivery_address:
        "400":
          description: Missing phoneNumber or password
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "phoneNumber and password are required"}
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "Invalid credentials"}
        '500': {$ref: "#/components/responses/ServerError"}
      description: Verifies phone number + password and returns the user's profile. **It does not return a token** — 
        there is no session or token auth yet (arrives in Week 9).
