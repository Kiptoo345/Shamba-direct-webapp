          description: Missing required fields
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "fullName, phoneNumber, password and role are required"}
        "409":
          description: Phone number or email already registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "An account with that phone number or email already exists"}
        '500': {$ref: "#/components/responses/ServerError"}
